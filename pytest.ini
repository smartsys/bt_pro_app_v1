[pytest]
# GEÄNDERT: Test-Infrastruktur-Konfiguration
# Integration-Tests (gegen echte Prod-DB, Monitoring-Charakter) per Default ausschliessen.
# Ausfuehren mit: pytest -m integration tests/test_iteration_id_backfill_quote.py
addopts = -m "not integration"

# GEÄNDERT: Cache-Verzeichnis nach /tmp. Die Suite läuft im Test-Container
# als uid 1000; /app gehört dort root, ein .pytest_cache im Arbeitsverzeichnis scheitert.
cache_dir = /tmp/pytest_cache

markers =
    integration: Tests die gegen echte Produktionsdaten laufen (kein Unit-Test-Charakter)
